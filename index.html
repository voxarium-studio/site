  <main>
    <section class="hero">
      <div class="container hero__inner">
        <div class="hero__copy">
          <h1 class="hero__title">
            <span class="visually-hidden">Voxarium</span>
            <span class="hero__letters" aria-hidden="true">
              <span style="--i: 0">V</span><span style="--i: 1">o</span><span style="--i: 2">x</span><span style="--i: 3">a</span><span style="--i: 4">r</span><span style="--i: 5">i</span><span style="--i: 6">u</span><span style="--i: 7">m</span>
            </span>
          </h1>
          <p class="hero__lead">A studio that really loves voxels.</p>
          <ul class="hero__pillars">
            <li class="hero__pillar" style="--i: 0">
              <svg class="cube cube--green hero__pillar-cube" aria-hidden="true"><use href="#cube"/></svg>
              Games
            </li>
            <li class="hero__pillar" style="--i: 1">
              <svg class="cube cube--teal hero__pillar-cube" aria-hidden="true"><use href="#cube"/></svg>
              Software
            </li>
            <li class="hero__pillar" style="--i: 2">
              <svg class="cube cube--orange hero__pillar-cube" aria-hidden="true"><use href="#cube"/></svg>
              Art
            </li>
          </ul>
          <nav class="hero__socials" aria-label="Follow the cubes">
            <ul class="socials">
              <li style="--i: 0">
                <a class="social social--instagram" href="https://www.instagram.com/voxarium" target="_blank" rel="noopener">
                  <svg class="social__icon" aria-hidden="true"><use href="#icon-instagram"/></svg>
                  <span class="social__name">Instagram</span>
                  <span class="social__arrow" aria-hidden="true"><svg><use href="#icon-arrow"/></svg></span>
                </a>
              </li>
              <li style="--i: 1">
                <a class="social social--youtube" href="https://www.youtube.com/@VoxariumStudio" target="_blank" rel="noopener">
                  <svg class="social__icon" aria-hidden="true"><use href="#icon-youtube"/></svg>
                  <span class="social__name">YouTube</span>
                  <span class="social__arrow" aria-hidden="true"><svg><use href="#icon-arrow"/></svg></span>
                </a>
              </li>
              <li style="--i: 2">
                <a class="social social--artstation" href="https://www.artstation.com/voxarium" target="_blank" rel="noopener">
                  <svg class="social__icon" aria-hidden="true"><use href="#icon-artstation"/></svg>
                  <span class="social__name">ArtStation</span>
                  <span class="social__arrow" aria-hidden="true"><svg><use href="#icon-arrow"/></svg></span>
                </a>
              </li>
              <li style="--i: 3">
                <a class="social social--pinterest" href="https://www.pinterest.com/voxarium/" target="_blank" rel="noopener">
                  <svg class="social__icon" aria-hidden="true"><use href="#icon-pinterest"/></svg>
                  <span class="social__name">Pinterest</span>
                  <span class="social__arrow" aria-hidden="true"><svg><use href="#icon-arrow"/></svg></span>
                </a>
              </li>
              <li style="--i: 4">
                <a class="social social--gumroad" href="https://voxarium.gumroad.com/" target="_blank" rel="noopener">
                  <svg class="social__icon" aria-hidden="true"><use href="#icon-gumroad"/></svg>
                  <span class="social__name">Gumroad</span>
                  <span class="social__arrow" aria-hidden="true"><svg><use href="#icon-arrow"/></svg></span>
                </a>
              </li>
            </ul>
            <a class="contact" href="mailto:contact@voxarium.studio">
              <svg class="contact__icon" aria-hidden="true"><use href="#icon-envelope"/></svg>
              contact@voxarium.studio
            </a>
          </nav>
        </div>

        <div class="hero__stage">
          <div class="hero__grid" aria-hidden="true"></div>
          <img class="hero__logo" src="assets/logo.png" alt="Voxarium logo: a voxel tree inside a flask" width="700" height="700">
          <div class="hero__cubes" aria-hidden="true">
            <span class="hero__cube hero__cube--1" data-depth="22" style="--i: 0"><svg class="cube cube--green"><use href="#cube"/></svg></span>
            <span class="hero__cube hero__cube--2" data-depth="14" style="--i: 1"><svg class="cube cube--teal"><use href="#cube"/></svg></span>
            <span class="hero__cube hero__cube--3" data-depth="8" style="--i: 2"><svg class="cube cube--orange"><use href="#cube"/></svg></span>
            <span class="hero__cube hero__cube--4" data-depth="10" style="--i: 3"><svg class="cube cube--green"><use href="#cube"/></svg></span>
            <span class="hero__cube hero__cube--5" data-depth="26" style="--i: 4"><svg class="cube cube--navy"><use href="#cube"/></svg></span>
            <span class="hero__cube hero__cube--6" data-depth="12" style="--i: 5"><svg class="cube cube--orange"><use href="#cube"/></svg></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>&copy; 2026 Voxarium</p>
      <p>Games, software and art.</p>
    </div>
  </footer>
</body>
</html>
